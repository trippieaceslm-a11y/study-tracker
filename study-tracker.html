<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semester Unit Tracker — Math & CS</title>
<link rel="manifest" href="Manifest.json">
<style>
  * { box-sizing: border-box; font-family: system-ui, sans-serif; }
  body { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; background: orange; }
  h1 { color: #000000; margin-bottom: 0.2rem; }
  h2 { color: #000000; font-size: 1rem; font-weight: bold; margin-top: 0; }
  .card { background: darkgreen; padding: 1.5rem; border-radius: 12px; margin-bottom: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  
  /* Top Controls */
  .top-controls { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem; }
  .semester-selector { display: flex; gap: 0.5rem; align-items: center; font-weight: bold; }
  .semester-selector select { padding: 0.5rem; font-size: 1rem; border-radius: 6px; border: 2px solid black; font-weight: bold; color: black; }
  
  input, select, button { padding: 0.6rem; font-size: 1rem; border-radius: 6px; border: 1px solid #ccc; }
  button { background: black; color: white; border: none; cursor: pointer; font-weight: 500; }
  button:hover { background: black; }
  
  .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .btn-outline { background: black; color: white; border: 1px solid black; }
  .btn-outline:hover { background: black; }
  
  .small-btn { padding: 0.4rem 0.6rem; font-size: 0.8rem; margin-right: 4px; white-space: nowrap; }
  .delete-btn { background: black; }
  .delete-btn:hover { background: #cc0000; }
  .edit-btn { background: #000; }
  .edit-btn:hover { background: yellow; }
  .log-btn { background: black; }
  .log-btn:hover { background: blue; }
  .save-btn { background: black; }
  .save-btn:hover { background: gold; }
  
  /* MOBILE FIX: Scrollable Table Wrapper */
  .table-wrap { overflow-x: auto; width: 100%; margin-top: 1rem; }
  table { width: 100%; border-collapse: collapse; min-width: 700px; /* Forces scroll on small screens */ }
  th, td { text-align: left; padding: 0.8rem 0.6rem; border-bottom: 1px solid white; vertical-align: middle; font-size: 0.95rem; }
  th { background: dodgerblue; font-size: 0.85rem; font-weight: bolder; text-transform: uppercase; color: #000000; }
  
  /* Actions column fix */
  .actions-cell { white-space: nowrap; }

  .stats { display: flex; gap: 1rem; margin-top: 1.5rem; flex-wrap: wrap; }
  .stat { flex: 1; min-width: 110px; background: darkturquoise; padding: 1rem; border-radius: 8px; text-align: center; }
  .stat strong { display: block; font-size: 1.5rem; color: black; }
  .stat.study-stat { background: coral; }
  .stat.study-stat strong { color: rgb(2, 44, 2); }
  
  .form-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .form-row input, .form-row select { flex: 1; min-width: 120px; }
  .units-input { width: 80px; }
  .course-code { color: black; font-size: 0.85rem; font-weight: bolder; }
</style>
</head>
<body>
  <h1>📚 Semester Unit Tracker</h1>
  <h2>Bachelor in Mathematics and Computer Science</h2>

  <div class="card top-controls">
    <div class="semester-selector">
      <label>📅 Semester:</label>
      <select id="semesterSelect" onchange="switchSemester(this.value)"></select>
      <button class="btn-outline small-btn" onclick="createSemester()">+ New</button>
    </div>
    <div class="btn-group">
      <button class="btn-outline" onclick="exportCSV()">⬇️ Export CSV</button>
      <button class="btn-outline" onclick="resetToDefaults()">↻ Reset Sem</button>
    </div>
  </div>

  <div class="card">
    <h3>Add a Course / Study Record</h3>
    <div class="form-row">
      <input id="name" placeholder="Course name (e.g. Calculus I)" />
      <input id="units" type="number" placeholder="Units" min="0" step="0.5" class="units-input" />
      <select id="status">
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
        <option value="Planned">Planned</option>
      </select>
      <button onclick="addRecord()">Add</button>
    </div>
  </div>

  <div class="card">
    <h3>My Records</h3>
    
    <!-- ADDED TABLE WRAPPER FOR MOBILE SCROLLING -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Code</th><th>Course</th><th>Units</th><th>Status</th><th>Study Hrs</th><th>Actions</th></tr>
        </thead>
        <tbody id="recordsBody"></tbody>
      </table>
    </div>
    
    <div class="stats">
      <div class="stat">Total Units<strong id="totalUnits">0</strong></div>
      <div class="stat">Completed<strong id="completedUnits">0</strong></div>
      <div class="stat">In Progress<strong id="inProgressUnits">0</strong></div>
      <div class="stat study-stat">Total Study Hrs<strong id="totalStudyHours">0</strong></div>
    </div>
  </div>

<script>
  const DEFAULT_COURSES = [
    { code: 'AAB4301', name: 'RESEARCH METHODOLOGY',                    units: 3, status: 'Planned' },
    { code: 'AMA4312', name: 'LINEAR ALGEBRA II',                       units: 3, status: 'Planned' },
    { code: 'AMA4314', name: 'REAL ANALYSIS I',                         units: 3, status: 'Planned' },
    { code: 'AMA4321', name: 'GROUP THEORY',                            units: 3, status: 'Planned' },
    { code: 'BAC4350', name: 'ACCOUNTS AND FINANCE',                    units: 3, status: 'Planned' },
    { code: 'CCS4301', name: 'COMPUTER ARCHITECTURE AND ORGANIZATION',  units: 3, status: 'Planned' },
    { code: 'CCS4302', name: 'PRINCIPLES OF ARTIFICIAL INTELLIGENCE',   units: 3, status: 'Planned' },
    { code: 'CIT4305', name: 'MOBILE AND WIRELESS NETWORKS',            units: 3, status: 'Planned' }
  ];

  const STORAGE_KEY = 'semesterRecords_v3';
  let appData = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
  
  if (!appData || !appData.semesters) {
    appData = {
      activeSemester: 'Semester 1',
      semesters: {
        'Semester 1': DEFAULT_COURSES.map((c, i) => ({ id: Date.now() + i, ...c, studyHours: 0 }))
      }
    };
    save();
  }

  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); }
  function getRecords() { return appData.semesters[appData.activeSemester] || []; }

  function renderSemesterDropdown() {
    const select = document.getElementById('semesterSelect');
    select.innerHTML = Object.keys(appData.semesters).map(sem => 
      `<option value="${sem}" ${sem === appData.activeSemester ? 'selected' : ''}>${sem}</option>`
    ).join('');
  }

  function switchSemester(sem) {
    appData.activeSemester = sem;
    save();
    render();
  }

  function createSemester() {
    const name = prompt("Enter new semester name (e.g., Semester 2, Year 4 Sem 1):");
    if (!name || name.trim() === '') return;
    const cleanName = name.trim();
    if (appData.semesters[cleanName]) { alert("A semester with that name already exists!"); return; }
    appData.semesters[cleanName] = [];
    appData.activeSemester = cleanName;
    save();
    renderSemesterDropdown();
    render();
  }

  function exportCSV() {
    const records = getRecords();
    if (records.length === 0) { alert("No records to export in this semester."); return; }
    let csvContent = "Code,Course Name,Units,Status,Study Hours\n";
    records.forEach(r => {
      csvContent += `"${r.code || ''}","${r.name}",${r.units},"${r.status}",${r.studyHours || 0}\n`;
    });
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.setAttribute("href", url);
    link.setAttribute("download", `${appData.activeSemester}_Tracker.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function logHours(id) {
    const records = getRecords();
    const rec = records.find(r => r.id === id);
    if (!rec) return;
    const input = prompt(`How many hours did you study for "${rec.name}"? (Enter a number)`, "1");
    if (input === null) return;
    const hours = parseFloat(input);
    if (isNaN(hours) || hours <= 0) { alert("Please enter a valid positive number."); return; }
    rec.studyHours = (rec.studyHours || 0) + hours;
    save();
    render();
  }

  function addRecord() {
    const name = document.getElementById('name').value.trim();
    const units = parseFloat(document.getElementById('units').value);
    const status = document.getElementById('status').value;
    if (!name || isNaN(units) || units <= 0) { alert('Please enter a course name and valid units.'); return; }
    getRecords().push({ id: Date.now(), code: '', name, units, status, studyHours: 0 });
    save();
    render();
    document.getElementById('name').value = '';
    document.getElementById('units').value = '';
  }

  function deleteRecord(id) {
    if (!confirm('Delete this record? Study hours for this course will also be lost.')) return;
    appData.semesters[appData.activeSemester] = getRecords().filter(r => r.id !== id);
    save();
    render();
  }

  function startEdit(id) {
    const rec = getRecords().find(r => r.id === id);
    const row = document.getElementById('row-' + id);
    row.innerHTML = `
      <td class="course-code">${rec.code || '—'}</td>
      <td><input id="edit-name-${id}" value="${rec.name}" style="width:100%; min-width:150px;"></td>
      <td><input id="edit-units-${id}" type="number" min="0" step="0.5" value="${rec.units}" class="units-input"></td>
      <td>
        <select id="edit-status-${id}">
          <option ${rec.status==='In Progress'?'selected':''}>In Progress</option>
          <option ${rec.status==='Completed'?'selected':''}>Completed</option>
          <option ${rec.status==='Planned'?'selected':''}>Planned</option>
        </select>
      </td>
      <td>${rec.studyHours || 0}</td>
      <td class="actions-cell">
        <button class="small-btn save-btn" onclick="saveEdit(${id})">Save</button>
        <button class="small-btn" onclick="render()">Cancel</button>
      </td>
    `;
  }

  function saveEdit(id) {
    const rec = getRecords().find(r => r.id === id);
    rec.name = document.getElementById(`edit-name-${id}`).value.trim() || rec.name;
    const u = parseFloat(document.getElementById(`edit-units-${id}`).value);
    if (!isNaN(u) && u >= 0) rec.units = u;
    rec.status = document.getElementById(`edit-status-${id}`).value;
    save();
    render();
  }

  function resetToDefaults() {
    if (!confirm(`Reset "${appData.activeSemester}" back to the default courses? Study hours will be lost.`)) return;
    appData.semesters[appData.activeSemester] = DEFAULT_COURSES.map((c, i) => ({ id: Date.now() + i, ...c, studyHours: 0 }));
    save();
    render();
  }

  function render() {
    const records = getRecords();
    const body = document.getElementById('recordsBody');
    
    if (records.length === 0) {
      body.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#888; padding: 2rem;">No courses here. Add one above or reset.</td></tr>`;
    } else {
      body.innerHTML = records.map(r => `
        <tr id="row-${r.id}">
          <td class="course-code">${r.code || '—'}</td>
          <td>${r.name}</td>
          <td>${r.units}</td>
          <td>${r.status}</td>
          <td><strong>${r.studyHours || 0}</strong></td>
          <td class="actions-cell">
            <button class="small-btn log-btn" onclick="logHours(${r.id})">⏱️ Log</button>
            <button class="small-btn edit-btn" onclick="startEdit(${r.id})">Edit</button>
            <button class="small-btn delete-btn" onclick="deleteRecord(${r.id})">Del</button>
          </td>
        </tr>
      `).join('');
    }

    const sum = (arr) => arr.reduce((s, r) => s + r.units, 0);
    const sumHours = (arr) => arr.reduce((s, r) => s + (r.studyHours || 0), 0);

    document.getElementById('totalUnits').textContent       = sum(records);
    document.getElementById('completedUnits').textContent   = sum(records.filter(r => r.status === 'Completed'));
    document.getElementById('inProgressUnits').textContent  = sum(records.filter(r => r.status === 'In Progress'));
    document.getElementById('totalStudyHours').textContent  = sumHours(records);
  }

  renderSemesterDropdown();
  render();
  if("serviceWorker" in navigation){
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>
