<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semester Unit Tracker — Math & CS</title>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

<link rel="icon" href="android-chrome-192x192.png">
<link rel="manifest" href="manifest.json">
<style>
  /* =====================================================
     COLORS  (edit the values here for the page itself)
     Buttons are NOT in this list: each button class
     further down has its own colors.
     ===================================================== */
  body {
    --page:#D9F2C4;      /* page background (light green) */
    --card:#FFFFFF;      /* cards (white) */
    --cell:#F2FAEA;      /* small boxes inside cards */
    --text:#000000;      /* all writing */
    --label:#7A5C00;     /* small gold labels */
    --gold:#F5B800;      /* gold accents */
    --line:rgba(0,0,0,0.25);
    --track:#E3E3E3;     /* empty progress bar */
  }
  body.dark-mode {
    --page:#0D0D0D; --card:#1A1A1A; --cell:#262626; --text:#FFFFFF;
    --label:#F5B800; --line:rgba(255,255,255,0.28); --track:#444444;
  }
  :root { color-scheme: light; }
  body.dark-mode { color-scheme: dark; }

  * { box-sizing: border-box; font-family: system-ui, sans-serif; scroll-behavior: smooth; }
  html { background: var(--page); }
  body { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; background: var(--page); color: var(--text); }
  h1 { color: var(--text); margin-bottom: 0.2rem; }
  h2 { color: var(--text); font-size: 1rem; font-weight: 600; margin-top: 0; }
  .card { background: var(--card); color: var(--text); padding: 1.5rem; border-radius: 12px; margin-bottom: 1rem; border: 1px solid var(--line); border-top: 4px solid var(--gold); box-shadow: 0 3px 10px rgba(0,0,0,0.15); }

  .top-controls { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem; }
  .semester-selector { display: flex; gap: 0.5rem; align-items: center; font-weight: bold; flex-wrap: wrap; }
  .semester-selector select { padding: 0.5rem; font-size: 1rem; border-radius: 6px; border: 2px solid var(--gold); font-weight: bold; }

  input, select { padding: 0.6rem; font-size: 1rem; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  body.dark-mode input, body.dark-mode select { background: var(--cell); }
  input::placeholder { color: var(--text); opacity: 0.5; }
  input:focus-visible, select:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  /* =====================================================
     BUTTONS: structure only (no colors) ...
     ===================================================== */
  .btn { padding: 0.6rem 1rem; font-size: 1rem; font-weight: 700; line-height: 1.2; border-radius: 8px; border-width: 2px; border-style: solid; cursor: pointer; }
  .btn-sm { padding: 0.4rem 0.7rem; font-size: 0.85rem; }
  .btn:focus-visible { outline: 3px solid #F5B800; outline-offset: 2px; }

  /* ... each button gets its own colors below. Change one without touching the others. */
  .btn-signin  { background: #F5B800; color: #000000; border-color: #8A6A00; }
  .btn-signin:hover  { background: #FFD54A; }

  .btn-logout  { background: #FFFFFF; color: #000000; border-color: #000000; }
  .btn-logout:hover  { background: #FFF2B8; }

  .btn-newsem  { background: #F5B800; color: #000000; border-color: #8A6A00; }
  .btn-newsem:hover  { background: #FFD54A; }

  .btn-delsem  { background: #FF4D4D; color: #000000; border-color: #A81212; }
  .btn-delsem:hover  { background: #FF7A7A; }

  .btn-notify  { background: #FFFFFF; color: #000000; border-color: #000000; }   /* base look */
  .btn-notify:hover  { background: #FFF2B8; }
  .btn-notify.btn-on  { background: #2ECC71; border-color: #17803F; }            /* alerts ON  = green */
  .btn-notify.btn-off { background: #FF4D4D; border-color: #A81212; }            /* alerts OFF = red   */

  .btn-export  { background: #FFFFFF; color: #000000; border-color: #000000; }
  .btn-export:hover  { background: #FFF2B8; }

  .btn-reset   { background: #FFFFFF; color: #000000; border-color: #000000; }
  .btn-reset:hover   { background: #FFF2B8; }

  .btn-theme   { background: #FFFFFF; color: #000000; border-color: #000000; }
  .btn-theme:hover   { background: #FFF2B8; }

  .btn-add     { background: #F5B800; color: #000000; border-color: #8A6A00; }
  .btn-add:hover     { background: #FFD54A; }

  .btn-create  { background: #F5B800; color: #000000; border-color: #8A6A00; }
  .btn-create:hover  { background: #FFD54A; }

  .btn-cancel  { background: #FFFFFF; color: #000000; border-color: #000000; }
  .btn-cancel:hover  { background: #FFF2B8; }

  .btn-log     { background: #F5B800; color: #000000; border-color: #8A6A00; }
  .btn-log:hover     { background: #FFD54A; }

  .btn-edit    { background: #FFFFFF; color: #000000; border-color: #000000; }
  .btn-edit:hover    { background: #FFF2B8; }

  .btn-clear   { background: #CDEFB2; color: #000000; border-color: #4C8C2B; }
  .btn-clear:hover   { background: #B5E48C; }

  .btn-delete  { background: #FF4D4D; color: #000000; border-color: #A81212; }
  .btn-delete:hover  { background: #FF7A7A; }

  .btn-save    { background: #F5B800; color: #000000; border-color: #8A6A00; }
  .btn-save:hover    { background: #FFD54A; }

  .btn-pass    { background: #2ECC71; color: #000000; border-color: #17803F; }   /* "Mark completed" */
  .btn-pass:hover    { background: #5EE096; }

  .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }

  /* ---------- Stats ---------- */
  .stats { display: flex; gap: 1rem; margin-top: 1.5rem; flex-wrap: wrap; }
  .stat { flex: 1; min-width: 110px; background: #FFF4C2; color: #000000; padding: 1rem; border-radius: 8px; text-align: center; border-bottom: 4px solid var(--gold); }
  .stat strong { display: block; font-size: 1.5rem; color: #000000; }
  .stat.study-stat { background: #CDEFB2; border-bottom-color: #2ECC71; }

  /* ---------- Add form ---------- */
  .form-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .fld { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 120px; font-size: 0.75rem; color: var(--text); font-weight: 600; }
  .fld input, .fld select { width: 100%; flex: none; min-width: 0; }

  /* ---------- Course cards ---------- */
  .course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; margin-top: 1rem; }
  .course-card { background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--gold); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
  .course-card.done { border-top-color: #2ECC71; }
  .cc-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .cc-code { font-weight: 800; color: var(--label); font-size: 0.9rem; letter-spacing: 0.05em; }
  .cc-units { font-size: 0.75rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: #F5B800; color: #000000; }
  .cc-name { font-weight: 700; font-size: 1.02rem; line-height: 1.25; }
  .unit-subtext { display: block; color: var(--text); opacity: 0.75; font-size: 0.8rem; margin-top: 4px; font-style: italic; max-height: 7.5em; overflow-y: auto; }
  .cc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cc-cell { background: var(--cell); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 0.85rem; min-width: 0; }
  .cc-cell small { display: block; color: var(--label); font-size: 0.65rem; text-transform: uppercase; font-weight: 700; letter-spacing: 0.04em; margin-bottom: 3px; }
  .cc-cell input, .cc-cell select { width: 100%; padding: 6px; font-size: 0.85rem; }
  .cc-wide { grid-column: 1 / -1; }
  .cc-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
  .cc-actions .btn { flex: 1; min-height: 40px; min-width: 64px; font-size: 0.85rem; text-align: center; }
  .empty-msg { grid-column: 1 / -1; text-align: center; padding: 2rem; }

  /* ---------- Pills: status, deadlines ---------- */
  .st, .dl { display: inline-block; padding: 2px 9px; border-radius: 99px; font-weight: 700; font-size: 0.8rem; color: #000000; }
  .st-done { background: #2ECC71; }                       /* Completed  = green */
  .st-prog { background: #F5B800; }                       /* In Progress = gold */
  .st-plan { background: #FFFFFF; border: 1px solid #000000; }  /* Planned = white */
  .dl-normal { background: #CDEFB2; }                     /* far away    = light green */
  .dl-soon   { background: #F5B800; }                     /* within 3 days = gold */
  .dl-red    { background: #FF4D4D; }                     /* within 1 day = red */
  .dl-pass   { background: #2ECC71; }                     /* Passed      = green */
  .dl-none   { opacity: 0.6; }

  .progress-container { width: 100%; background: var(--track); border-radius: 4px; height: 8px; margin-top: 4px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 4px; transition: width 0.3s ease; }

  /* ---------- Today's Focus ---------- */
  .focus-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px; background: var(--cell); border-radius: 6px; border-left: 5px solid var(--gold); }
  .focus-title { font-weight: bolder; font-size: 0.95rem; }
  .focus-reason { font-size: 0.8rem; font-weight: bolder; padding: 4px 8px; border-radius: 12px; background: #CDEFB2; color: #000000; }
  .focus-gold { background: #F5B800; }
  .focus-urgent { background: #FF4D4D; }
  .ok-msg { margin: 0; font-weight: bold; }

  /* ---------- Modal ---------- */
  .modal-box { background: var(--card); color: var(--text); padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; border: 1px solid var(--line); border-top: 4px solid var(--gold); }

  /* ---------- Collapsible headers ---------- */
  .collapsible-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; padding-bottom: 10px; border-bottom: 1px solid transparent; transition: border-color 0.2s; }
  .collapsible-header:hover { border-bottom-color: var(--gold); }
  .collapsible-header h3 { margin: 0; }
  .collapsible-icon { font-size: 1.2rem; transition: transform 0.3s ease; }

  /* ---------- Weekly chart ---------- */
  .week-chart { display: flex; align-items: flex-end; gap: 8px; height: 130px; margin-top: 1rem; }
  .wk-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; font-size: 0.7rem; }
  .wk-col b { font-size: 0.7rem; min-height: 1em; }
  .wk-bar { width: 100%; border-radius: 6px 6px 0 0; background: #F5B800; }
  .wk-col.today .wk-bar { background: #2ECC71; }

  @media (max-width: 600px) {
    body { margin: 10px auto; padding: 0 10px; overflow-x: hidden; }
    h1 { font-size: 1.3rem; }
    h2 { font-size: 0.85rem; margin-bottom: 10px; }
    .card { padding: 12px; margin-bottom: 10px; border-radius: 8px; }
    .top-controls { flex-direction: column; align-items: stretch; gap: 8px; padding: 10px; }
    .semester-selector { justify-content: space-between; font-size: 0.9rem; flex-wrap: wrap; gap: 5px; }
    .semester-selector select { flex: 1; padding: 6px; }
    .btn-group { width: 100%; display: flex; gap: 5px; flex-wrap: wrap; }
    .btn-group .btn { flex: 1; padding: 8px; font-size: 0.85rem; }
    .form-row { flex-direction: column; gap: 8px; }
    .fld { width: 100% !important; flex: none !important; }
    .fld input, .fld select { padding: 10px; font-size: 0.95rem; }
    .form-row .btn { align-self: stretch !important; width: 100%; }
    .course-grid { grid-template-columns: 1fr; }
    .cc-actions .btn { min-height: 44px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .stat { padding: 10px 5px; min-width: 0; border-radius: 6px; }
    .stat strong { font-size: 1.2rem; }
  }
</style>
</head>
<body>
  <h1>📚 Semester Unit Tracker</h1>
  <h2>Bachelor in Mathematics and Computer Science</h2>

  <div class="card top-controls">
    <div id="auth-container" style="display:flex;align-items:center;gap:10px;margin-bottom:10px;width:100%;justify-content:flex-end;">
      <button id="loginBtn" class="btn btn-signin" onclick="signIn()">Sign in with Google</button>
      <div id="userinfo" style="display:none;align-items:center;gap:10px;">
        <span id="userName" style="font-weight:bolder;"></span>
        <button class="btn btn-sm btn-logout" onclick="signOut()">Logout</button>
      </div>
    </div>
    <div class="semester-selector">
      <label>📅 Semester:</label>
      <select id="semesterSelect" onchange="switchSemester(this.value)"></select>
      <button class="btn btn-sm btn-newsem" onclick="createSemester()">+ New</button>
      <button class="btn btn-sm btn-delsem" onclick="deleteSemester()">🗑️ Del</button>
    </div>
    <div class="btn-group">
      <button class="btn btn-notify btn-off" id="notifyBtn" onclick="toggleNotifications()">🔕Alerts:OFF</button>
      <button class="btn btn-export" onclick="exportCSV()">⬇️ Export CSV</button>
      <button class="btn btn-reset" onclick="resetToDefaults()">↻ Reset Sem</button>
      <button class="btn btn-theme" onclick="toggleDarkMode()" id="themeBtn">🌙Dark</button>
    </div>
  </div>

  <!-- Collapsible: Add course -->
  <div class="card" id="addRecordSection">
    <div class="collapsible-header" onclick="toggleSection('addRecordContent', 'addRecordIcon')">
      <h3>➕ Add a Course / Study Record</h3>
      <span class="collapsible-icon" id="addRecordIcon">▼</span>
    </div>
    <div id="addRecordContent" style="display:none;margin-top:15px;">
      <div class="form-row">
        <label class="fld" style="flex:none;width:130px;"><span>Code</span><input id="code" placeholder="AMA4312" style="text-transform:uppercase;" /></label>
        <label class="fld" style="flex:2;min-width:180px;"><span>Course name</span><input id="name" placeholder="Linear Algebra" /></label>
        <label class="fld"><span>Unit names (optional)</span><input id="unitNames" placeholder="e.g. Vectors, Matrices" /></label>
        <label class="fld" style="flex:none;width:80px;"><span>Units</span><input id="units" type="number" placeholder="3" min="0" step="0.5" /></label>
        <label class="fld" style="flex:none;"><span>Exam date &amp; time</span><input id="examDate" type="datetime-local" /></label>
        <label class="fld" style="flex:none;width:100px;"><span>Class day</span>
          <select id="classDay"><option value="">—</option><option>Mon</option><option>Tue</option><option>Wed</option><option>Thu</option><option>Fri</option><option>Sat</option><option>Sun</option></select>
        </label>
        <label class="fld" style="flex:none;"><span>Class time</span><input id="classTime" type="time" /></label>
        <label class="fld" style="flex:none;"><span>CAT date &amp; time</span><input id="catDate" type="datetime-local" /></label>
        <label class="fld" style="flex:none;"><span>Assignment due</span><input id="assignmentDate" type="datetime-local" /></label>
        <label class="fld" style="flex:none;width:90px;"><span>Goal hrs</span><input id="studyGoal" type="number" placeholder="10" min="1" /></label>
        <label class="fld" style="flex:none;width:130px;"><span>Status</span>
          <select id="status">
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
            <option value="Planned">Planned</option>
          </select>
        </label>
        <button class="btn btn-add" onclick="addRecord()" style="align-self:flex-end;">Add</button>
      </div>
    </div>
  </div>

  <div class="card" id="focusCard">
    <h3>🎯 Today's Focus</h3>
    <div id="focusContent" style="display:flex;flex-direction:column;gap:8px;"></div>
  </div>

  <div class="card" id="statsCard">
    <h3>📈 Study streak &amp; this week</h3>
    <div class="stats">
      <div class="stat">🔥 Streak (days)<strong id="streakVal">0</strong></div>
      <div class="stat">Today<strong id="todayVal">0h</strong></div>
      <div class="stat study-stat">Last 7 days<strong id="weekVal">0h</strong></div>
    </div>
    <div class="week-chart" id="weekChart"></div>
  </div>

  <!-- Collapsible: My records -->
  <div class="card" id="recordsSection">
    <div class="collapsible-header" onclick="toggleSection('recordsContent', 'recordsIcon')">
      <h3>📚 My Records</h3>
      <span class="collapsible-icon" id="recordsIcon">▼</span>
    </div>
    <div id="recordsContent" style="display:none;margin-top:15px;">
      <div id="recordsGrid" class="course-grid"></div>
      <div class="stats">
        <div class="stat">Total Units<strong id="totalUnits">0</strong></div>
        <div class="stat">Completed<strong id="completedUnits">0</strong></div>
        <div class="stat">In Progress<strong id="inProgressUnits">0</strong></div>
        <div class="stat study-stat">Total Study Hrs<strong id="totalStudyHours">0</strong></div>
      </div>
    </div>
  </div>

  <!-- New Semester pop-up -->
  <div id="semesterModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:9999;justify-content:center;align-items:center;">
    <div class="modal-box">
      <h3 style="margin-top:0;">Create New Semester</h3>
      <input type="text" id="newSemesterName" placeholder="e.g. Year 4 Sem 1" style="width:100%;padding:12px;margin-bottom:15px;font-size:1rem;border-radius:6px;box-sizing:border-box;">
      <div style="display:flex;gap:10px;">
        <button class="btn btn-create" onclick="submitNewSemester()" style="flex:1;padding:12px;">Create</button>
        <button class="btn btn-cancel" onclick="closeSemesterModal()" style="flex:1;padding:12px;">Cancel</button>
      </div>
    </div>
  </div>

<script>
  // --- UI toggle ---
  function toggleSection(contentId, iconId) {
    const content = document.getElementById(contentId);
    const icon = document.getElementById(iconId);
    const open = content.style.display === 'none';
    content.style.display = open ? 'block' : 'none';
    if (icon) icon.style.transform = open ? 'rotate(180deg)' : 'rotate(0deg)';
  }

  // Escape user text before putting it into HTML
  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function dayKey(d) {
    const x = d || new Date();
    return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
  }

  const DAYS = ['', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  function dayOptions(sel) {
    return DAYS.map(d => `<option value="${d}" ${d === (sel || '') ? 'selected' : ''}>${d || '—'}</option>`).join('');
  }
  function formatClass(r) {
    if (!r.classDay && !r.classTime) return '<span class="dl-none">—</span>';
    let t = '';
    if (r.classTime) {
      const [h, m] = r.classTime.split(':').map(Number);
      t = ((h % 12) || 12) + ':' + String(m).padStart(2, '0') + ' ' + (h >= 12 ? 'PM' : 'AM');
    }
    return `<strong>${esc((r.classDay || '') + ' ' + t).trim()}</strong>`;
  }

  // hours studied per day, across all semesters
  function hoursByDay() {
    const m = {};
    Object.values(appData.semesters).forEach(list =>
      list.forEach(r => (r.sessions || []).forEach(s => { m[s.d] = (m[s.d] || 0) + s.h; })));
    return m;
  }

  function getStreak() {
    const by = hoursByDay();
    const d = new Date();
    if (!by[dayKey(d)]) d.setDate(d.getDate() - 1); // today not studied yet: streak still alive
    let n = 0;
    while (by[dayKey(d)]) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }

  // days since last session for a course (99 = never studied)
  function neglectDays(r) {
    const s = r.sessions || [];
    if (!s.length) return 99;
    const last = s.reduce((m, x) => (x.d > m ? x.d : m), '');
    const [y, mo, da] = last.split('-').map(Number);
    const today = new Date(); today.setHours(0, 0, 0, 0);
    return Math.round((today - new Date(y, mo - 1, da)) / 86400000);
  }

  const DEFAULT_COURSES = [
    { code: 'AAB4301', name: 'RESEARCH METHODOLOGY',                   units: 3, status: 'Planned' },
    { code: 'AMA4312', name: 'LINEAR ALGEBRA II',                      units: 3, status: 'Planned' },
    { code: 'AMA4314', name: 'REAL ANALYSIS I',                        units: 3, status: 'Planned' },
    { code: 'AMA4321', name: 'GROUP THEORY',                           units: 3, status: 'Planned' },
    { code: 'BAC4350', name: 'ACCOUNTS AND FINANCE',                   units: 3, status: 'Planned' },
    { code: 'CCS4301', name: 'COMPUTER ARCHITECTURE AND ORGANIZATION', units: 3, status: 'Planned' },
    { code: 'CCS4302', name: 'PRINCIPLES OF ARTIFICIAL INTELLIGENCE',  units: 3, status: 'Planned' },
    { code: 'CIT4305', name: 'MOBILE AND WIRELESS NETWORKS',           units: 3, status: 'Planned' }
  ];

  const STORAGE_KEY = 'semesterRecords_v3';

  function makeCourses() {
    return DEFAULT_COURSES.map((c, i) => ({
      id: Date.now() + i, ...c, studyHours: 0, studyGoal: 10, unitNames: '', examDate: '', assignmentDate: '', catDate: '', classDay: '', classTime: ''
    }));
  }
  function defaultData() {
    return { activeSemester: 'Semester 1', semesters: { 'Semester 1': makeCourses() } };
  }

  // --- Firebase setup ---
  const firebaseConfig = {
    apiKey: "AIzaSyDTYRpVcDOjGEglChSQFfYDSy-S2CmJRYA",
    authDomain: "study-tracker-1980.firebaseapp.com",
    projectId: "study-tracker-1980",
    storageBucket: "study-tracker-1980.firebasestorage.app",
    messagingSenderId: "189368177608",
    appId: "1:189368177608:web:7cfd24a9f2fe1d326fe6fd"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentUser = null;
  let unsubscribeSnapshot = null;

  function loadLocal() {
    try {
      const d = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (d && d.semesters && Object.keys(d.semesters).length) return d;
    } catch (e) {}
    return defaultData();
  }
  let appData = loadLocal();
  if (!appData.semesters[appData.activeSemester]) appData.activeSemester = Object.keys(appData.semesters)[0];

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    if (currentUser) {
      db.collection('users').doc(currentUser.uid).set(appData)
        .catch(e => console.error('Error saving to cloud:', e));
    }
  }
  function getRecords() {
    if (!appData.semesters[appData.activeSemester]) appData.semesters[appData.activeSemester] = [];
    return appData.semesters[appData.activeSemester];
  }

  // --- Semesters ---
  function renderSemesterDropdown() {
    const select = document.getElementById('semesterSelect');
    select.innerHTML = Object.keys(appData.semesters).map(sem =>
      `<option value="${esc(sem)}" ${sem === appData.activeSemester ? 'selected' : ''}>${esc(sem)}</option>`
    ).join('');
  }
  function switchSemester(sem) { appData.activeSemester = sem; save(); render(); }

  function createSemester() {
    document.getElementById('semesterModal').style.display = 'flex';
    document.getElementById('newSemesterName').value = '';
    document.getElementById('newSemesterName').focus();
  }
  function closeSemesterModal() { document.getElementById('semesterModal').style.display = 'none'; }

  function submitNewSemester() {
    const input = document.getElementById('newSemesterName').value.trim();
    if (!input) { alert('Please enter a name.'); return; }
    if (appData.semesters[input]) { alert('Semester already exists!'); return; }
    appData.semesters[input] = [];
    appData.activeSemester = input;
    save(); renderSemesterDropdown(); render();
    closeSemesterModal();
  }

  function deleteSemester() {
    const currentSem = appData.activeSemester;
    if (Object.keys(appData.semesters).length <= 1) {
      alert('You cannot delete your only semester! Create a new one first.');
      return;
    }
    if (!confirm(`Are you sure you want to permanently delete "${currentSem}" and all its data?`)) return;
    delete appData.semesters[currentSem];
    appData.activeSemester = Object.keys(appData.semesters)[0];
    save(); renderSemesterDropdown(); render();
  }

  // --- Deadline display ---
  function formatDeadline(dateStr) {
    if (!dateStr) return '<span class="dl-none">—</span>';
    const deadline = new Date(dateStr);
    const now = new Date();
    if (deadline < now) return '<span class="dl dl-pass">Passed</span>';

    const formatted = deadline.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    const diffDays = (deadline - now) / (1000 * 60 * 60 * 24);

    let cls = 'dl-normal';
    if (diffDays <= 1) cls = 'dl-red';
    else if (diffDays <= 3) cls = 'dl-soon';
    return `<span class="dl ${cls}">${formatted}</span>`;
  }

  // --- CSV export ---
  function exportCSV() {
    const records = getRecords();
    if (records.length === 0) { alert('No records to export.'); return; }
    const q = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
    let csv = 'Code,Course Name,Unit Names,Units,Status,Class,CAT,Exam Date,Assignment Due,Study Hours,Goal Hours\n';
    records.forEach(r => {
      csv += [q(r.code), q(r.name), q(r.unitNames), r.units, q(r.status), q(((r.classDay || '') + ' ' + (r.classTime || '')).trim()), q(r.catDate), q(r.examDate), q(r.assignmentDate), r.studyHours || 0, r.studyGoal || 10].join(',') + '\n';
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.setAttribute('href', url);
    link.setAttribute('download', `${appData.activeSemester}_Tracker.csv`);
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
  }

  // --- Records ---
  function logHours(id) {
    const rec = getRecords().find(r => r.id === id);
    if (!rec) return;
    const input = prompt(`How many hours did you study for "${rec.name}"?`, '1');
    if (input === null) return;
    const hours = parseFloat(input);
    if (isNaN(hours) || hours <= 0) { alert('Please enter a valid positive number.'); return; }
    rec.studyHours = (rec.studyHours || 0) + hours;
    rec.sessions = rec.sessions || [];
    rec.sessions.push({ d: dayKey(), h: hours });
    save(); render();
  }

  function addRecord() {
    const code = document.getElementById('code').value.trim().toUpperCase();
    const name = document.getElementById('name').value.trim();
    const unitNames = document.getElementById('unitNames').value.trim();
    const units = parseFloat(document.getElementById('units').value);
    const examDate = document.getElementById('examDate').value;
    const assignmentDate = document.getElementById('assignmentDate').value;
    const catDate = document.getElementById('catDate').value;
    const classDay = document.getElementById('classDay').value;
    const classTime = document.getElementById('classTime').value;
    const studyGoal = parseFloat(document.getElementById('studyGoal').value) || 10;
    const status = document.getElementById('status').value;

    if (!name || isNaN(units) || units <= 0) { alert('Please enter a valid course name and units.'); return; }

    getRecords().push({ id: Date.now(), code, name, unitNames, units, examDate, assignmentDate, catDate, classDay, classTime, status, studyHours: 0, studyGoal });
    save(); render();

    ['code', 'name', 'unitNames', 'units', 'examDate', 'assignmentDate', 'catDate', 'classDay', 'classTime', 'studyGoal'].forEach(f => document.getElementById(f).value = '');
  }

  // Clear resets hours, status and dates. Name and units stay.
  function clearRecordData(id) {
    if (!confirm('Clear study hours, status and dates for this course? Name and units stay.')) return;
    const rec = getRecords().find(r => r.id === id);
    if (!rec) return;
    rec.studyHours = 0;
    rec.sessions = [];
    rec.status = 'Planned';
    rec.examDate = '';
    rec.assignmentDate = '';
    rec.catDate = '';
    save(); render();
  }

  function markCompleted(id) {
    const rec = getRecords().find(r => r.id === id);
    if (!rec) return;
    rec.status = 'Completed';
    save(); render();
  }

  function deleteRecord(id) {
    if (!confirm('Delete this record completely?')) return;
    appData.semesters[appData.activeSemester] = getRecords().filter(r => r.id !== id);
    save(); render();
  }

  function startEdit(id) {
    const rec = getRecords().find(r => r.id === id);
    const card = document.getElementById('row-' + id);
    if (!rec || !card) return;
    card.innerHTML = `
      <div class="cc-grid">
        <div class="cc-cell"><small>Code</small><input id="edit-code-${id}" value="${esc(rec.code)}" style="text-transform:uppercase;"></div>
        <div class="cc-cell"><small>Units</small><input id="edit-units-${id}" type="number" min="0" step="0.5" value="${rec.units}"></div>
        <div class="cc-cell cc-wide"><small>Course name</small><input id="edit-name-${id}" value="${esc(rec.name)}"></div>
        <div class="cc-cell cc-wide"><small>Unit names / topics</small><input id="edit-unitnames-${id}" value="${esc(rec.unitNames)}"></div>
        <div class="cc-cell"><small>Status</small>
          <select id="edit-status-${id}">
            <option ${rec.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
            <option ${rec.status === 'Completed' ? 'selected' : ''}>Completed</option>
            <option ${rec.status === 'Planned' ? 'selected' : ''}>Planned</option>
          </select></div>
        <div class="cc-cell"><small>Goal hrs (done: ${rec.studyHours || 0})</small><input id="edit-goal-${id}" type="number" min="1" value="${rec.studyGoal || 10}"></div>
        <div class="cc-cell cc-wide"><small>Exam date &amp; time</small><input id="edit-examdate-${id}" type="datetime-local" value="${rec.examDate || ''}"></div>
        <div class="cc-cell"><small>Class day</small><select id="edit-classday-${id}">${dayOptions(rec.classDay)}</select></div>
        <div class="cc-cell"><small>Class time</small><input id="edit-classtime-${id}" type="time" value="${rec.classTime || ''}"></div>
        <div class="cc-cell cc-wide"><small>CAT date &amp; time</small><input id="edit-catdate-${id}" type="datetime-local" value="${rec.catDate || ''}"></div>
        <div class="cc-cell cc-wide"><small>Assignment due</small><input id="edit-assignmentdate-${id}" type="datetime-local" value="${rec.assignmentDate || ''}"></div>
      </div>
      <div class="cc-actions">
        <button class="btn btn-save" onclick="saveEdit(${id})">Save</button>
        <button class="btn btn-cancel" onclick="render()">Cancel</button>
      </div>`;
  }

  function saveEdit(id) {
    const rec = getRecords().find(r => r.id === id);
    if (!rec) return;
    rec.code = document.getElementById(`edit-code-${id}`).value.trim().toUpperCase();
    rec.name = document.getElementById(`edit-name-${id}`).value.trim() || rec.name;
    rec.unitNames = document.getElementById(`edit-unitnames-${id}`).value.trim();
    const u = parseFloat(document.getElementById(`edit-units-${id}`).value);
    if (!isNaN(u) && u >= 0) rec.units = u;
    rec.status = document.getElementById(`edit-status-${id}`).value;
    rec.examDate = document.getElementById(`edit-examdate-${id}`).value;
    rec.assignmentDate = document.getElementById(`edit-assignmentdate-${id}`).value;
    rec.catDate = document.getElementById(`edit-catdate-${id}`).value;
    rec.classDay = document.getElementById(`edit-classday-${id}`).value;
    rec.classTime = document.getElementById(`edit-classtime-${id}`).value;
    const goal = parseFloat(document.getElementById(`edit-goal-${id}`).value);
    if (!isNaN(goal) && goal > 0) rec.studyGoal = goal;
    save(); render();
  }

  function resetToDefaults() {
    if (!confirm('Reset to default courses? Study hours will be lost.')) return;
    appData.semesters[appData.activeSemester] = makeCourses();
    save(); render();
  }

  // --- Today's Focus ---
  function daysUntil(dateStr) {
    if (!dateStr) return 999;
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const target = new Date(dateStr); target.setHours(0, 0, 0, 0);
    return Math.round((target - today) / (1000 * 60 * 60 * 24));
  }

  function renderFocusDashboard() {
    const container = document.getElementById('focusContent');

    const focusCourses = getRecords().filter(r => {
      if (r.status === 'In Progress') return true;
      if (r.examDate) { const d = daysUntil(r.examDate); if (d >= 0 && d <= 7) return true; }
      if (r.assignmentDate) { const d = daysUntil(r.assignmentDate); if (d >= 0 && d <= 7) return true; }
      if (r.catDate) { const d = daysUntil(r.catDate); if (d >= 0 && d <= 7) return true; }
      return false;
    });

    const getMinDays = course => {
      let min = 999;
      if (course.examDate) { const d = daysUntil(course.examDate); if (d >= 0) min = Math.min(min, d); }
      if (course.assignmentDate) { const d = daysUntil(course.assignmentDate); if (d >= 0) min = Math.min(min, d); }
      if (course.catDate) { const d = daysUntil(course.catDate); if (d >= 0) min = Math.min(min, d); }
      return min;
    };
    focusCourses.sort((a, b) => (getMinDays(a) - getMinDays(b)) || (neglectDays(b) - neglectDays(a)));

    if (focusCourses.length === 0) {
      container.innerHTML = `<p class="ok-msg">You're all caught up! No active courses or upcoming deadlines this week. 🎉</p>`;
      return;
    }

    container.innerHTML = focusCourses.map(r => {
      const badges = [];
      if (r.examDate) {
        const d = daysUntil(r.examDate);
        if (d >= 0 && d <= 7) badges.push(`<span class="focus-reason focus-urgent">🚨 ${d === 0 ? 'Exam TODAY!' : 'Exam in ' + d + 'd'}</span>`);
      }
      if (r.assignmentDate) {
        const d = daysUntil(r.assignmentDate);
        if (d >= 0 && d <= 7) badges.push(`<span class="focus-reason focus-gold">📝 ${d === 0 ? 'Task TODAY!' : 'Task in ' + d + 'd'}</span>`);
      }
      if (r.catDate) {
        const d = daysUntil(r.catDate);
        if (d >= 0 && d <= 7) badges.push(`<span class="focus-reason focus-urgent">📋 ${d === 0 ? 'CAT TODAY!' : 'CAT in ' + d + 'd'}</span>`);
      }
      const nd = neglectDays(r);
      if (nd === 99) badges.push(`<span class="focus-reason focus-gold">😴 Not started</span>`);
      else if (nd >= 3) badges.push(`<span class="focus-reason focus-gold">😴 ${nd}d without study</span>`);
      if (badges.length === 0) badges.push(`<span class="focus-reason">In Progress</span>`);

      return `
        <div class="focus-item">
          <div class="focus-title">${r.code ? esc(r.code) + ' - ' : ''}${esc(r.name)}</div>
          <div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;">${badges.join('')}</div>
        </div>`;
    }).join('');
  }

  function renderStats() {
    const by = hoursByDay();
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      days.push({ label: d.toLocaleDateString('en-US', { weekday: 'short' }), h: by[dayKey(d)] || 0 });
    }
    const max = Math.max(1, ...days.map(x => x.h));
    const week = days.reduce((s, x) => s + x.h, 0);
    const r1 = n => Math.round(n * 10) / 10;

    document.getElementById('streakVal').textContent = getStreak();
    document.getElementById('todayVal').textContent = r1(by[dayKey()] || 0) + 'h';
    document.getElementById('weekVal').textContent = r1(week) + 'h';
    document.getElementById('weekChart').innerHTML = days.map((x, i) =>
      `<div class="wk-col${i === 6 ? ' today' : ''}"><b>${x.h ? r1(x.h) : ''}</b>` +
      `<div class="wk-bar" style="height:${Math.max(3, x.h / max * 80)}px"></div><span>${x.label}</span></div>`
    ).join('');
  }

  // --- Main render ---
  function render() {
    const records = getRecords();
    const grid = document.getElementById('recordsGrid');

    if (records.length === 0) {
      grid.innerHTML = `<div class="empty-msg">No courses yet. Add one above or tap Reset Sem.</div>`;
    } else {
      grid.innerHTML = records.map(r => {
        const hrs = r.studyHours || 0, goal = r.studyGoal || 10;
        const pct = Math.min((hrs / goal) * 100, 100);
        const color = hrs >= goal ? '#2ECC71' : '#F5B800';
        const overdue = r.examDate && r.status !== 'Completed' && new Date(r.examDate) < new Date();
        const mark = overdue
          ? `<button class="btn btn-sm btn-pass" style="display:block;margin:6px 0 0;" onclick="markCompleted(${r.id})">✔ Mark completed</button>` : '';
        return `
        <div class="course-card${r.status === 'Completed' ? ' done' : ''}" id="row-${r.id}">
          <div class="cc-head">
            <span class="cc-code">${esc(r.code) || '—'}</span>
            <span class="cc-units">${r.units} unit${Number(r.units) === 1 ? '' : 's'}</span>
          </div>
          <div>
            <div class="cc-name">${esc(r.name)}</div>
            ${r.unitNames ? `<span class="unit-subtext">${esc(r.unitNames)}</span>` : ''}
          </div>
          <div class="cc-grid">
            <div class="cc-cell"><small>Status</small><span class="st ${r.status === 'Completed' ? 'st-done' : r.status === 'In Progress' ? 'st-prog' : 'st-plan'}">${esc(r.status)}</span>${mark}</div>
            <div class="cc-cell"><small>Study progress</small><strong>${hrs}</strong>/${goal} hrs
              <div class="progress-container"><div class="progress-fill" style="width:${pct}%;background:${color};"></div></div></div>
            <div class="cc-cell"><small>Class</small>${formatClass(r)}</div>
            <div class="cc-cell"><small>CAT</small>${formatDeadline(r.catDate)}</div>
            <div class="cc-cell"><small>Exam</small>${formatDeadline(r.examDate)}</div>
            <div class="cc-cell"><small>Assignment due</small>${formatDeadline(r.assignmentDate)}</div>
          </div>
          <div class="cc-actions">
            <button class="btn btn-log" onclick="logHours(${r.id})">⏱️ Log</button>
            <button class="btn btn-edit" onclick="startEdit(${r.id})">Edit</button>
            <button class="btn btn-clear" onclick="clearRecordData(${r.id})">🧹 Clear</button>
            <button class="btn btn-delete" onclick="deleteRecord(${r.id})">Del</button>
          </div>
        </div>`;
      }).join('');
    }

    const sum = arr => arr.reduce((s, r) => s + (Number(r.units) || 0), 0);
    const sumHours = arr => arr.reduce((s, r) => s + (r.studyHours || 0), 0);

    document.getElementById('totalUnits').textContent      = sum(records);
    document.getElementById('completedUnits').textContent  = sum(records.filter(r => r.status === 'Completed'));
    document.getElementById('inProgressUnits').textContent = sum(records.filter(r => r.status === 'In Progress'));
    document.getElementById('totalStudyHours').textContent = sumHours(records);

    renderFocusDashboard();
    renderStats();
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js?v=62').catch(() => {});
  }

  // --- Notifications ---
  const hasNotif = 'Notification' in window;

  function updateNotificationsButton() {
    const btn = document.getElementById('notifyBtn');
    if (!btn) return;
    const on = hasNotif && Notification.permission === 'granted' && localStorage.getItem('alertsOff') !== 'true';
    btn.innerHTML = on ? '🔔Alerts:ON' : '🔕Alerts:OFF';
    btn.classList.toggle('btn-on', on);
    btn.classList.toggle('btn-off', !on);
  }

  function toggleNotifications() {
    if (!hasNotif) { alert('This browser does not support notifications.'); return; }
    const isOff = localStorage.getItem('alertsOff') === 'true' || Notification.permission !== 'granted';
    if (isOff) {
      localStorage.setItem('alertsOff', 'false');
      if (Notification.permission !== 'granted') {
        Notification.requestPermission().then(() => { updateNotificationsButton(); checkUpcomingExams(); });
      } else {
        updateNotificationsButton(); checkUpcomingExams();
      }
    } else {
      localStorage.setItem('alertsOff', 'true');
      updateNotificationsButton();
    }
  }

  function sendNativeNotification(title, body) {
    const opts = { body, icon: 'android-chrome-192x192.png', vibrate: [200, 100, 200] };
    const fallback = () => { try { new Notification(title, opts); } catch (e) {} };
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistration()
        .then(reg => reg ? reg.showNotification(title, opts) : fallback())
        .catch(fallback);
    } else {
      fallback();
    }
  }

  function checkUpcomingExams() {
    if (!hasNotif || Notification.permission !== 'granted') return;
    if (localStorage.getItem('alertsOff') === 'true') return;

    const todayString = new Date().toDateString();
    const notifyOnce = (key, title, body) => {
      if (localStorage.getItem(key) === todayString) return;
      sendNativeNotification(title, body);
      localStorage.setItem(key, todayString);
    };

    getRecords().forEach(r => {
      const label = r.name || 'Course';
      if (r.examDate) {
        const d = daysUntil(r.examDate);
        if (d >= 0 && d <= 1) {
          notifyOnce(`notified_exam_${r.id}`, '🚨 EXAM ALERT', `${label} exam is ${d === 0 ? 'TODAY' : 'TOMORROW'}! Time to study!`);
        }
      }
      if (r.assignmentDate) {
        const d = daysUntil(r.assignmentDate);
        if (d >= 0 && d <= 1) {
          notifyOnce(`notified_task_${r.id}`, '📝 TASK DUE', `${label} assignment/CAT is due ${d === 0 ? 'TODAY' : 'TOMORROW'}!`);
        }
      }
      if (r.catDate) {
        const d = daysUntil(r.catDate);
        if (d >= 0 && d <= 1) {
          notifyOnce(`notified_cat_${r.id}`, '📋 CAT ALERT', `${label} CAT is ${d === 0 ? 'TODAY' : 'TOMORROW'}! Time to revise!`);
        }
      }
    });
  }

  // --- Dark mode ---
  function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
    localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
    updateThemeButton();
  }
  function updateThemeButton() {
    const btn = document.getElementById('themeBtn');
    if (!btn) return;
    btn.innerHTML = document.body.classList.contains('dark-mode') ? '☀️Light' : '🌙Dark';
  }
  if (localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark-mode');
  updateThemeButton();
  updateNotificationsButton();

  // --- Authentication & cloud sync ---
  function signIn() {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(e => alert('Login failed: ' + e.message));
  }
  function signOut() { auth.signOut(); }

  auth.onAuthStateChanged(user => {
    if (unsubscribeSnapshot) { unsubscribeSnapshot(); unsubscribeSnapshot = null; }

    if (user) {
      currentUser = user;
      document.getElementById('loginBtn').style.display = 'none';
      document.getElementById('userinfo').style.display = 'flex';
      document.getElementById('userName').textContent = (user.displayName || user.email || '').split(' ')[0];

      unsubscribeSnapshot = db.collection('users').doc(user.uid).onSnapshot(doc => {
        if (doc.exists && doc.data().semesters) {
          appData = doc.data();
          if (!appData.semesters[appData.activeSemester]) appData.activeSemester = Object.keys(appData.semesters)[0];
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        } else {
          save();
        }
        renderSemesterDropdown();
        render();
      }, e => console.error('Cloud sync error:', e));
    } else {
      currentUser = null;
      document.getElementById('loginBtn').style.display = 'block';
      document.getElementById('userinfo').style.display = 'none';
      appData = loadLocal();
      if (!appData.semesters[appData.activeSemester]) appData.activeSemester = Object.keys(appData.semesters)[0];
      renderSemesterDropdown();
      render();
    }
  });

  // --- Start ---
  renderSemesterDropdown();
  render();
  checkUpcomingExams();
</script>
</body>
</html>
